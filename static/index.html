<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}
table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px;vertical-align:top}th{background:#eef4f7}
.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}code{background:#edf0f2;padding:2px 5px}
tr.clickable{cursor:pointer}tr.clickable:hover{background:#f2f7fa}
.pill{padding:2px 8px;border-radius:10px;background:#e3ebf0;white-space:nowrap;font-size:13px}
.fail{color:#a33}.ok{color:#23845b}
.events{margin:0;padding-left:18px}.events li{margin:2px 0;list-style:square;font-size:13px}
#detail h2{margin-top:36px;border-top:2px solid #d5dde3;padding-top:16px}
</style>
<h1>公共采购密封投标与评审</h1><div class="card">公开页面只展示项目元数据，投标正文按角色和执行阶段隐藏。写接口需要 <code>X-User</code>、<code>X-Role</code>。点击项目行可在下方查看项目详情。</div>
<p>详情身份：<input id="user" value="proc-demo" size="10">
<select id="role"><option>procurement</option><option>supervisor</option><option>auditor</option><option>vendor</option><option>public</option></select></p>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<div id="detail"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const headers=()=>({'X-User':document.querySelector('#user').value,'X-Role':document.querySelector('#role').value});
const STATUS_CLS={opened:'ok',qualified:'ok',awarded:'ok',disqualified:'fail',qualification_failed:'fail',withdrawn:'fail'};
const QUAL_CLS={approved:'ok',revoked:'fail',rejected:'fail',pending:''};
async function showDetail(id){
  const d=await fetch('/api/tenders/'+id,{headers:headers()}).then(r=>r.json());
  const box=document.querySelector('#detail');
  if(d.error){box.innerHTML='<h2>项目详情</h2><p class="fail">'+esc(d.error)+'</p>';return;}
  const bids=(d.bids||[]).map(b=>`<tr><td>${esc(b.vendor_id)}</td><td>${esc(b.price)}</td>
    <td><span class="pill ${STATUS_CLS[b.status]||''}">${esc(b.status)}</span></td>
    <td class="fail">${esc(b.status_reason||'')}</td></tr>`).join('');
  const quals=(d.qualifications||[]).map(q=>`<tr>
    <td>${esc(q.vendor_name||q.vendor_id)}<br><small>${esc(q.vendor_no)}</small></td>
    <td><span class="pill ${QUAL_CLS[q.status]||''}">${esc(q.status)}</span></td>
    <td>${esc(q.review_comment||'')}<br><small>${q.reviewed_at?('审核人 '+esc(q.reviewed_by)+' · '+esc(q.reviewed_at)):''}</small></td>
    <td><ul class="events">${q.events.map(e=>`<li>${esc(e.created_at)}　${esc(e.actor)}　<b>${esc(e.action)}</b> → ${esc(e.status)}${e.comment?'（'+esc(e.comment)+'）':''}</li>`).join('')}</ul></td></tr>`).join('');
  box.innerHTML=`<h2>项目详情：${esc(d.tender.tender_no)} ${esc(d.tender.title)}
      <span class="pill">${esc(d.tender.status)}</span></h2>
    <h3>投标</h3><table><thead><tr><th>供应商</th><th>报价</th><th>状态</th><th>开标说明</th></tr></thead>
      <tbody>${bids||'<tr><td colspan="4">（当前身份在当前阶段不可见）</td></tr>'}</tbody></table>
    <h3>资格预审（状态 / 审核意见 / 冻结记录）</h3>
    <table><thead><tr><th>供应商</th><th>资格状态</th><th>审核意见</th><th>冻结记录（每次变更）</th></tr></thead>
      <tbody>${quals||'<tr><td colspan="4">（暂无资格预审记录或当前身份不可见）</td></tr>'}</tbody></table>`;
}
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  const tbody=document.querySelector('#tenders tbody');
  tbody.innerHTML=d.tenders.map(r=>`<tr class="clickable" data-id="${r.id}"><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.deadline)}</td><td>${r.evaluation_round}</td><td>${r.version}</td></tr>`).join('');
  tbody.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.id));
  document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${esc(r.price)}</td><td><span class="pill ${STATUS_CLS[r.status]||''}">${esc(r.status)}</span>${r.status_reason?'<div class="fail"><small>'+esc(r.status_reason)+'</small></div>':''}</td><td>${esc(String(r.payload_hash).slice(0,12))}…</td></tr>`).join('');
}
load()
</script></html>
