<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}code{background:#edf0f2;padding:2px 5px}#tenders tbody tr{cursor:pointer}#tenders tbody tr:hover{background:#f2f8fb}.muted{color:#6b7a85}input{padding:4px 6px}</style>
<h1>公共采购密封投标与评审</h1><div class="card">公开页面只展示项目元数据，投标正文按角色和执行阶段隐藏。写接口需要 <code>X-User</code>、<code>X-Role</code>。项目已接入资格预审：供应商按项目提交资格材料，审核通过后才能投标；撤销资格后未开标投标仍保留，开标时记为资格审查未通过并写明原因，不再参与评分与授标。</div>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<h2>项目详情</h2><p><label>角色 <input id="role" value="procurement"></label> <label>用户 <input id="user" value="proc-demo"></label> <span class="muted">点击项目行查看资格状态、审核意见和冻结记录</span></p><div id="detail"><p class="muted">尚未选择项目。</p></div>
<script>
const BID_STATUS={sealed:'密封',opened:'已开标',withdrawn:'已撤回',disqualified:'已废标',awarded:'已授标',qualified:'合格',qualification_failed:'资格审查未通过'};
const QUAL_STATUS={pending:'待审核',approved:'已通过',rejected:'未通过',revoked:'已撤销'};
const QUAL_ACTION={submitted:'提交材料',updated:'修改材料',resubmitted:'重新提交',approved:'审核通过',rejected:'审核未通过',revoked:'撤销资格（冻结未开标投标）',bid_failed:'开标记为资格审查未通过'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const empty=n=>`<tr><td class="muted" colspan="${n}">暂无记录</td></tr>`;
async function load(){const d=await fetch('/api/state').then(r=>r.json());document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr onclick="loadDetail(${r.id})"><td>${r.tender_no}</td><td>${r.title}</td><td>${r.status}</td><td>${r.deadline}</td><td>${r.evaluation_round}</td><td>${r.version}</td></tr>`).join('');document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${BID_STATUS[r.status]||r.status}</td><td>${r.payload_hash.slice(0,12)}…</td></tr>`).join('')}
async function loadDetail(id){const h={'X-User':document.getElementById('user').value,'X-Role':document.getElementById('role').value};const d=await fetch('/api/tenders/'+id,{headers:h}).then(r=>r.json());const box=document.getElementById('detail');if(d.error){box.innerHTML=`<p class="muted">${esc(d.error)}</p>`;return}
box.innerHTML=`<h3>${esc(d.tender.tender_no)} ${esc(d.tender.title)} <span class="muted">${esc(d.tender.status)}</span></h3>
<h4>投标</h4><table><thead><tr><th>ID</th><th>供应商</th><th>报价</th><th>状态</th><th>原因</th></tr></thead><tbody>${d.bids.map(b=>`<tr><td>${b.id}</td><td>${b.vendor_id}</td><td>${b.price??''}</td><td>${BID_STATUS[b.status]||esc(b.status)}</td><td>${esc(b.status_reason||'')}</td></tr>`).join('')||empty(5)}</tbody></table>
<h4>资格预审</h4><table><thead><tr><th>供应商</th><th>状态</th><th>审核意见</th><th>审核人</th><th>审核时间</th></tr></thead><tbody>${d.qualifications.map(q=>`<tr><td>${q.vendor_id}</td><td>${QUAL_STATUS[q.status]||esc(q.status)}</td><td>${esc(q.review_comment||'')}</td><td>${esc(q.reviewed_by||'')}</td><td>${q.reviewed_at||''}</td></tr>`).join('')||empty(5)}</tbody></table>
<h4>资格变更与冻结记录</h4><table><thead><tr><th>时间</th><th>操作</th><th>供应商</th><th>说明</th><th>涉及投标</th><th>操作人</th></tr></thead><tbody>${d.qualification_events.map(e=>`<tr><td>${e.created_at}</td><td>${QUAL_ACTION[e.action]||esc(e.action)}</td><td>${e.vendor_id}</td><td>${esc(e.comment)}</td><td>${(e.bid_ids||[]).join(', ')}</td><td>${esc(e.actor)}</td></tr>`).join('')||empty(6)}</tbody></table>`}
load()</script></html>
